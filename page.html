const gigs=[
 {id:1,title:'Help moving a sofa this weekend',category:'Moving & delivery',icon:'↗',tone:'orange',pay:850,unit:'fixed',place:'Barangay Pansol, Quezon City, Metro Manila',time:'Tomorrow, 10:00 AM',client:'Maria Santos',rating:'4.9',apps:4,desc:'Looking for a second pair of hands to help move a sofa and two small bookcases from my apartment to a new place nearby. I have a van arranged; just need help carrying and loading.'},
 {id:2,title:'Dog walker needed for two afternoons',category:'Pet care',icon:'♡',tone:'green',pay:250,unit:'per hour',place:'Barangay San Roque, Antipolo City, Rizal',time:'Wed & Thu, 2:00 PM',client:'Miguel Reyes',rating:'5.0',apps:2,desc:'Friendly senior golden retriever needs a 45-minute neighborhood walk on Wednesday and Thursday afternoons. Easygoing dog, leash and treats provided.'},
 {id:3,title:'Assemble a standing desk',category:'Home help',icon:'⌂',tone:'blue',pay:600,unit:'fixed',place:'Barangay Tikay, Malolos City, Bulacan',time:'This week · flexible',client:'Ana Garcia',rating:'4.8',apps:6,desc:'Need help assembling a new standing desk and monitor arm. Tools are included and setup instructions are available. Should take about 90 minutes.'},
 {id:4,title:'Pick up groceries for a neighbor',category:'Errands',icon:'＋',tone:'pink',pay:300,unit:'fixed',place:'Barangay Balibago, Angeles City, Pampanga',time:'Today, before 6 PM',client:'Carlo Rivera',rating:'4.9',apps:1,desc:'A quick grocery pickup from the local market, list is ready to go. Reimbursement for groceries is separate from the gig payment.'},
 {id:5,title:'Plant care while I’m out of town',category:'Home & garden',icon:'❋',tone:'green',pay:450,unit:'fixed',place:'Barangay Salitran, Dasmariñas City, Cavite',time:'Fri–Sun',client:'Liza Bautista',rating:'5.0',apps:3,desc:'Water a few houseplants and check in on them over the weekend. Everything is labeled and easy to find.'},
 {id:6,title:'Help photograph a small event',category:'Creative',icon:'◉',tone:'blue',pay:1500,unit:'fixed',place:'Barangay Balibago, Santa Rosa City, Laguna',time:'Saturday, 4:00 PM',client:'Jose Mendoza',rating:'4.7',apps:5,desc:'Looking for a hobby photographer to capture candid moments at a small backyard celebration. No advanced gear required.'}
];
let state={page:'home',filter:'All',selectedGig:1,applied:new Set(),accepted:new Set(),completed:new Set(),released:new Set(),posted:[],messages:[{name:'Maria Santos',initials:'MS',tone:'rose',last:'That sounds great, thank you!',time:'9:42 AM',gig:'Help moving a sofa this weekend',chat:[['theirs','Hi Juan! Thanks for applying. Are you free tomorrow around 10?','9:35 AM'],['mine','Hi Maria, yes — 10 works perfectly. I’ll bring gloves too.','9:39 AM'],['theirs','That sounds great, thank you!','9:42 AM']]},{name:'Miguel Reyes',initials:'MR',tone:'blue',last:'I can share the details shortly.',time:'Yesterday',gig:'Dog walker needed for two afternoons',chat:[['theirs','Hi! Are you familiar with the Quezon Memorial Circle, Quezon City?','Yesterday'],['mine','Yes, I walk there often.','Yesterday'],['theirs','I can share the details shortly.','Yesterday']]}],activeChat:0,applications:[{gig:'Help moving a sofa this weekend',provider:'Juan Dela Cruz',initials:'JD',tone:'',pay:850,status:'Pending',id:1},{gig:'Plant care while I’m out of town',provider:'Lea Flores',initials:'LF',tone:'rose',pay:450,status:'Pending',id:5},{gig:'Assemble a standing desk',provider:'Angelo Cruz',initials:'AC',tone:'blue',pay:600,status:'Accepted',id:3}],disputeOpen:false};
state.accepted.add(3);
state.applicationFilter='All';
state.typingChat=-1;
state.profile={name:'Juan Dela Cruz',location:'Quezon City, Metro Manila',locality:'Quezon City',province:'Metro Manila',country:'Philippines',islandGroup:'Luzon',region:'National Capital Region (NCR)',birthDate:'1990-01-01',username:'',userId:'',photo:'',about:'Friendly, reliable neighbor who enjoys helping neighbors in Quezon City, Metro Manila. I’m happy to lend a hand with errands, moving, and home projects.',skills:'Moving help, Errands, Home projects, Pet care'};
state.authenticated=false;
state.typingChats=new Set();
state.reviews=[
 {author:'Angelo Cruz',rating:5,text:'Juan was so helpful and right on time. Would definitely work together again!',gig:'Assemble a standing desk',date:'3 days ago'},
 {author:'Lea Flores',rating:5,text:'Great communication and took wonderful care of everything. Thank you!',gig:'Plant care',date:'1 week ago'}
];
const savedDemo=JSON.parse(localStorage.getItem('giglink-local-demo')||'null');
if(savedDemo&&typeof savedDemo==='object'){
 if(savedDemo.profile&&typeof savedDemo.profile==='object')state.profile={...state.profile,...savedDemo.profile};
 if(Array.isArray(savedDemo.applications)){state.applications=savedDemo.applications;state.accepted=new Set(state.applications.filter(a=>a.status==='Accepted').map(a=>a.id))}
 if(Array.isArray(savedDemo.messages))state.messages=savedDemo.messages;
 if(Array.isArray(savedDemo.reviews))state.reviews=savedDemo.reviews;
}
const locationRegions={Luzon:['National Capital Region (NCR)','Cordillera Administrative Region (CAR)','Ilocos Region (Region I)','Cagayan Valley (Region II)','Central Luzon (Region III)','CALABARZON (Region IV-A)','MIMAROPA (Region IV-B)','Bicol Region (Region V)'],Visayas:['Western Visayas (Region VI)','Central Visayas (Region VII)','Eastern Visayas (Region VIII)'],Mindanao:['Zamboanga Peninsula (Region IX)','Northern Mindanao (Region X)','Davao Region (Region XI)','SOCCSKSARGEN (Region XII)','Caraga (Region XIII)','Bangsamoro Autonomous Region in Muslim Mindanao (BARMM)']};
function makeUserId(){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);return `GL-${String(bytes[0]%100000000).padStart(8,'0')}`}
function makeUsername(name){const base=name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')||'member';return `${base}.${String(state.profile.userId||makeUserId()).replace(/\D/g,'').slice(-4)}`}
state.profile.country='Philippines';
state.profile.userId=state.profile.userId||makeUserId();
state.profile.username=state.profile.username||makeUsername(state.profile.name);
state.profile.islandGroup=state.profile.islandGroup||'Luzon';
state.profile.region=state.profile.region||'National Capital Region (NCR)';
state.profile.locality=state.profile.locality||'Quezon City';
state.profile.province=state.profile.province||'Metro Manila';
state.authenticated=false;
state.page='auth';
state.authMode=savedDemo?.profile?.accountCreated?'signin':'create';
const filipinoNameMap={'Jordan Davis':'Juan Dela Cruz','Maya Chen':'Maria Santos','Elliot Park':'Miguel Reyes','Nora Williams':'Ana Garcia','Sam Rivera':'Carlo Rivera','Priya Patel':'Liza Bautista','Alex Morgan':'Jose Mendoza','Lena Brooks':'Lea Flores','Kai Thompson':'Angelo Cruz'};
function migrateDemoName(name){return filipinoNameMap[name]||name}
function migrateDemoText(text){return Object.entries(filipinoNameMap).reduce((value,[oldName,newName])=>value.split(oldName).join(newName),text)}
state.profile.name=migrateDemoName(state.profile.name);
state.profile.about=migrateDemoText(state.profile.about);
state.applications.forEach(application=>{application.provider=migrateDemoName(application.provider);application.initials=application.provider.split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase()});
state.messages.forEach(message=>{message.name=migrateDemoName(message.name);message.initials=message.name.split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase();message.last=migrateDemoText(message.last);message.chat.forEach(item=>item[1]=migrateDemoText(item[1]))});
state.reviews.forEach(review=>{review.author=migrateDemoName(review.author);review.text=migrateDemoText(review.text)});
function saveDemo(){try{localStorage.setItem('giglink-local-demo',JSON.stringify({profile:state.profile,authenticated:state.authenticated,applications:state.applications,messages:state.messages,reviews:state.reviews}))}catch(error){console.error('Could not save the local account data.',error);notify('Unable to save this change in this browser. Try a smaller profile photo or free up browser storage.')}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function refreshAccountUI(){const initials=state.profile.name.split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join('').toUpperCase()||'U';document.getElementById('sidebarAvatar').textContent=initials;document.getElementById('sidebarName').textContent=state.authenticated?state.profile.name:'Signed out';document.getElementById('sidebarLocation').textContent=state.authenticated?state.profile.location:'Sign in to your account';document.getElementById('messageCount').textContent=state.messages.length;document.getElementById('applicationCount').textContent=state.applications.filter(a=>a.status==='Pending').length}
function handleGlobalSearch(){const input=document.getElementById('globalSearch');const query=input.value.trim().toLowerCase();if(!query)return;const profileTerms=[state.profile.name,state.profile.username,state.profile.userId].filter(Boolean).map(value=>value.toLowerCase());if(profileTerms.includes(query)){go('profile');input.value='';return}go('browse');const gigSearch=document.getElementById('gigSearch');if(gigSearch){gigSearch.value=input.value;renderBrowse()}else notify('No local profile found. Search gigs or exact profile username/ID.')}
function go(page){if(page==='messages'&&state.page==='detail'){const gig=allGigs().find(item=>item.id===state.selectedGig);if(gig)state.activeChat=ensureConversation(gig.client,gig.title)}else if(page==='messages'&&state.page==='transactions'){const task=activeTasks()[0];if(task)state.activeChat=ensureConversation(task.provider,task.title)}state.page=page;document.getElementById('sidebar').classList.remove('open');document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'})}
function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function badge(status){return `<span class="badge ${status.toLowerCase()}">${status}</span>`}
function header(title,sub,action=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="heading-actions">${action}</div>`:''}</div>`}
function btn(text,action,cls='primary',icon=''){return `<button class="btn ${cls}" onclick="${action}">${icon?`<span>${icon}</span>`:''}${text}</button>`}
function stat(label,val,foot,tone=''){return `<div class="card stat-card"><div class="stat-top">${label}<span class="stat-icon ${tone}"><svg viewBox="0 0 24 24"><path d="M4 18V6m0 12h16M7 14l4-4 3 2 5-6"/></svg></span></div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}
function gigRow(g){return `<div class="gig-row" onclick="openGig(${g.id})"><div class="gig-icon ${g.tone}">${g.icon}</div><div class="gig-main"><h3>${g.title}</h3><p>${g.category} &nbsp;·&nbsp; ${g.place}</p></div><div class="gig-meta"><strong>${formatMoney(g.pay)}${g.unit==='per hour'?'<small>/hr</small>':''}</strong><small>${g.time.split('·')[0]}</small></div></div>`}
function allGigs(){return [...gigs,...state.posted]}
function render(){if(!state.authenticated)state.page='auth';document.body.classList.toggle('auth-required',!state.authenticated);const c=document.getElementById('content');const pages={home:homePage,browse:browsePage,detail:detailPage,post:postPage,applications:applicationsPage,transactions:transactionsPage,messages:messagesPage,escrow:escrowPage,history:historyPage,reviews:reviewsPage,profile:profilePage,disputes:disputesPage,auth:authPage};c.innerHTML=(pages[state.page]||homePage)();if(state.page==='messages'){const threadHeader=document.querySelector('.thread-header');threadHeader.insertAdjacentHTML('afterbegin','<button class="btn small" style="margin-bottom:10px" onclick="openNewConversationModal()">＋ New conversation</button>')}refreshAccountUI()}
function homePage(){const tasks=activeTasks();return `<div class="grid stats">${stat('Open applications',state.applications.filter(a=>a.status==='Pending').length,'Pending responses','blue')}${stat('Active transactions',tasks.length,'Accepted tasks in progress','')}${stat('In escrow',formatMoney(tasks.filter(t=>!state.released.has(t.id)).reduce((sum,t)=>sum+t.pay,0)+1450),'Securely held for your gigs','amber')}${stat('Community rating',`${reviewAverage()} <span style="font:14px DM Sans;color:#e5a845">★</span>`,`Based on ${12+mineReviews().length} reviews`,'gray')}</div><section class="card panel home-recommended"><div class="panel-head"><h2>Recommended near you</h2><button class="link-btn" onclick="go('browse')">Explore all →</button></div><div class="gig-list">${allGigs().slice(0,3).map(gigRow).join('')}</div></section><div class="grid home-bottom-grid"><section class="card panel"><div class="panel-head"><h2>Your active tasks</h2><button class="link-btn" onclick="go('transactions')">View all →</button></div>${tasks.length?`<div class="gig-list">${tasks.slice(0,3).map(t=>`<div class="gig-row" onclick="go('transactions')"><div class="gig-icon green">✓</div><div class="gig-main"><h3>${escapeHtml(t.title)}</h3><p>${escapeHtml(t.provider||'Maria Santos')} · ${t.due||'In progress'}</p></div><div>${badge(t.status||'Active')}</div></div>`).join('')}</div>`:`<div class="empty" style="padding:21px"><span>◷</span>No accepted tasks yet. Accept an application to start one.</div>`}</section><section class="card panel home-activity"><div class="panel-head"><h2>Recent activity</h2><button class="link-btn" onclick="go('history')">See all</button></div><div class="activity"><div class="activity-item"><div class="activity-dot">✓</div><div class="activity-copy"><strong>Application sent</strong> · Sofa moving<small>Today, 9:20 AM</small></div></div><div class="activity-item"><div class="activity-dot">₱</div><div class="activity-copy"><strong>Payment secured</strong> · Desk assembly<small>Yesterday, 4:12 PM</small></div></div><div class="activity-item"><div class="activity-dot">★</div><div class="activity-copy"><strong>New review received</strong> · “Super helpful!”<small>Monday, 1:30 PM</small></div></div></div></section></div>`}
function browsePage(){return `${header('Find your next gig','Good work is happening right around the corner.')}<div class="toolbar"><div class="filter-row">${['All','Moving & delivery','Home help','Pet care','Errands','Creative'].map(x=>`<button class="filter-chip ${state.filter===x?'selected':''}" onclick="state.filter='${x}';renderBrowse()">${x}</button>`).join('')}</div><label class="search-top" style="width:220px"><span>⌕</span><input id="gigSearch" placeholder="Search by keyword…" oninput="renderBrowse(false)" /></label></div><div class="grid gig-cards" id="gigCards">${gigCardList()}</div>`}
function gigCardList(){let q=(document.getElementById('gigSearch')?.value||'').toLowerCase();let list=allGigs().filter(g=>(state.filter==='All'||g.category===state.filter)&&`${g.title} ${g.category} ${g.desc}`.toLowerCase().includes(q));return list.length?list.map(g=>`<article class="card gig-card" onclick="openGig(${g.id})"><div class="gig-card-top"><div class="gig-icon ${g.tone}">${g.icon}</div><span class="badge active">Open</span></div><h3>${g.title}</h3><p class="description">${g.desc.slice(0,115)}…</p><div class="tag-row"><span class="tag">⌖ ${g.place}</span><span class="tag">◷ ${g.time}</span></div><div class="gig-card-foot"><div><strong>${formatMoney(g.pay)}${g.unit==='per hour'?'<span style="font-size:10px;color:#87939a;font-weight:400"> / hr</span>':''}</strong><small>${g.client} · ★ ${g.rating}</small></div><button class="btn small soft" onclick="event.stopPropagation();openGig(${g.id})">View gig</button></div></article>`).join(''):`<div class="card empty" style="grid-column:1/-1"><span>⌕</span>No gigs match your search yet.</div>`}
function renderBrowse(reset=true){const holder=document.getElementById('gigCards');if(holder)holder.innerHTML=gigCardList()}

function detailPage(){const g=allGigs().find(x=>x.id===state.selectedGig)||gigs[0];const applied=state.applied.has(g.id);return `${header('Gig details','A little more about this opportunity.',`<button class="btn" onclick="go('browse')">← Back to gigs</button>`)}<div class="detail-layout"><section class="card detail-card"><div class="detail-title"><div class="gig-icon ${g.tone}">${g.icon}</div><div><h2>${g.title}</h2><p>${g.category} &nbsp;·&nbsp; Posted recently &nbsp;·&nbsp; ${badge('Active')}</p></div></div><div class="detail-body"><h3>About this gig</h3>${g.desc}<h3>What you’ll do</h3><ul style="padding-left:18px;margin:6px 0"><li>Arrive at the agreed time and coordinate with the client.</li><li>Complete the task with care and keep the client updated.</li><li>Mark the work complete when you’re finished.</li></ul><h3>Location &amp; timing</h3><p>⌖ ${g.place}<br>◷ ${g.time}</p><h3>Payment protection</h3><p>Funds are secured in escrow before work begins and released once the client approves the completed task.</p></div><div style="border-top:1px solid var(--line);padding-top:17px;margin-top:18px;display:flex;justify-content:space-between;align-items:center"><div class="person-row"><div class="avatar gold">${g.client.split(' ').map(x=>x[0]).join('')}</div><div><strong>${g.client}</strong><small>Client · ★ ${g.rating} · ${g.apps} gigs posted</small></div></div><button class="link-btn" onclick="go('messages')">Message client</button></div></section><aside class="card detail-side"><div class="eyebrow">Gig payment</div><div class="price-large">${formatMoney(g.pay)} <small>${g.unit==='per hour'?'per hour':'fixed price'}</small></div><div class="line-item"><span>Gig payment</span><strong>${formatMoney(g.pay)}</strong></div><div class="line-item"><span>Secure escrow</span><strong>Included</strong></div><div class="line-item" style="border:0"><span>Platform fee</span><strong>${formatMoney(0)}</strong></div><div style="margin-top:16px">${applied?`<button class="btn soft" style="width:100%;justify-content:center" disabled>✓ Application sent</button>`:`<button class="btn primary" style="width:100%;justify-content:center" onclick="applyGig(${g.id})">Apply for this gig</button>`}</div><p style="font-size:10px;color:#97a1a7;line-height:1.55;margin:12px 0 0;text-align:center">No payment is made until your application is accepted.</p></aside></div>`}
function applyGig(id){const g=allGigs().find(x=>x.id===id);state.applied.add(id);if(!state.applications.some(a=>a.id===id))state.applications.unshift({gig:g.title,provider:state.profile.name,initials:state.profile.name.split(/\s+/).map(part=>part[0]).join('').slice(0,2).toUpperCase(),pay:g.pay,status:'Pending',id});state.applicationFilter='All';saveDemo();notify('Application sent to '+g.client);render()}

tyle="font-size:13px;margin-bottom:10px">A great gig post includes</h3><div class="activity"><div class="activity-item"><div class="activity-dot">1</div><div class="activity-copy">A clear, specific title</div></div><div class="activity-item"><div class="activity-dot">2</div><div class="activity-copy">A fair budget and timing</div></div><div class="activity-item"><div class="activity-dot">3</div><div class="activity-copy">Helpful details about the task</div></div></div></section></div></div>`}

function applicationsPage(){const statuses=['All','Pending','Accepted','Declined'];const applications=state.applications.filter(a=>state.applicationFilter==='All'||a.status===state.applicationFilter);return `${header('Applications','Track pending, accepted, and declined applications.') }<div class="toolbar"><div class="filter-row">${statuses.map(status=>`<button class="filter-chip ${state.applicationFilter===status?'selected':''}" onclick="setApplicationFilter('${status}')">${status} · ${status==='All'?state.applications.length:state.applications.filter(a=>a.status===status).length}</button>`).join('')}</div><button class="btn" onclick="go('messages')">✉ Messages</button></div><div class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Provider</th><th>Gig</th><th>Proposed</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>${applications.map(a=>`<tr><td><div class="person-row"><div class="avatar ${escapeHtml(a.tone||'')}">${escapeHtml(a.initials)}</div><div><strong>${escapeHtml(a.provider)}</strong><span class="muted">★ 4.9 · Verified</span></div></div></td><td><strong>${escapeHtml(a.gig)}</strong><span class="muted">Philippines · Local</span></td><td><strong>${formatMoney(a.pay)}</strong></td><td>Today</td><td>${badge(a.status)}</td><td><div class="table-actions">${a.status==='Accepted'?`<button class="btn small soft" onclick="go('transactions')">View task</button>`:a.status==='Pending'?`<button class="btn small primary" onclick="acceptApplication(${a.id})">Accept</button><button class="btn small danger" onclick="declineApplication(${a.id})">Decline</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>${applications.length===0?'<div class="empty">No applications in this status.</div>':''}</div>`}

function transactionsPage(){let tasks=activeTasks();return `${header('Active transactions','Follow each task from accepted to complete.')}${tasks.length?`<div class="grid" style="grid-template-columns:1fr">${tasks.map(t=>`<section class="card panel" style="margin-bottom:14px"><div class="panel-head"><div><div class="eyebrow">Transaction #GL-${String(t.id).padStart(4,'0')}</div><h2>${t.title}</h2></div>${badge(t.status)}</div><div class="person-row" style="margin:14px 0"><div class="avatar">${t.provider.split(' ').map(x=>x[0]).join('')}</div><div><strong>${t.provider}</strong><small>Service provider · Metro Manila</small></div><button class="btn small" style="margin-left:auto" onclick="go('messages')">✉ Message</button></div><div class="flow-steps">${flowStep('Application accepted','Provider confirmed for the task',true)}${flowStep('Work in progress','Keep in touch through messages',true)}${flowStep('Task completed','Provider marks work as finished',state.completed.has(t.id)||state.released.has(t.id))}${flowStep('Client approval & payment','Escrow released after approval',state.released.has(t.id))}</div><div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px"><div><strong style="font-size:15px">${formatMoney(t.pay)}</strong><small style="display:block;color:var(--muted);font-size:10px;margin-top:3px">Protected by escrow</small></div><div>${!state.completed.has(t.id)&&!state.released.has(t.id)?`<button class="btn primary" onclick="markComplete(${t.id})">Mark task complete</button>`:state.completed.has(t.id)?`<button class="btn primary" onclick="approveTask(${t.id})">Approve &amp; release payment</button>`:`<button class="btn soft" onclick="go('reviews')">Leave a review</button>`}</div></div></section>`).join('')}</div>`:`<div class="card empty"><span>◷</span>No active transactions yet. Accept an application to start a task.</div>`}`}
function flowStep(title,sub,done){return `<div class="flow-step"><div class="step-icon ${done?'':'wait'}">${done?'✓':'·'}</div><div class="step-copy"><strong>${title}</strong><small>${sub}</small></div></div>`}

function escrowPage(){const tasks=activeTasks();const held=tasks.filter(t=>!state.released.has(t.id)).reduce((n,t)=>n+t.pay,0)+1450;return `${header('Payments & escrow','Your funds are protected at every step.') }<div class="grid dashboard-grid"><div class="grid"><section class="card panel escrow-hero"><div class="eyebrow">Funds currently protected</div><h2>Secure escrow balance</h2><p>Funds stay protected until the task is complete and approved.</p><div class="escrow-amount">${formatMoney(held)}</div><div style="font-size:10px;color:#7e908c">Across ${Math.max(1,tasks.length+2)} active transactions</div></section><section class="card panel"><div class="panel-head"><h2>Recent escrow activity</h2><button class="link-btn" onclick="go('history')">View history →</button></div><div class="activity"><div class="activity-item"><div class="activity-dot">◈</div><div class="activity-copy"><strong>${formatMoney(600)} secured</strong> · Assemble a standing desk<small>Yesterday · Protected in escrow</small></div>${badge('Active')}</div><div class="activity-item"><div class="activity-dot">✓</div><div class="activity-copy"><strong>${formatMoney(850)} secured</strong> · Sofa moving<small>Today · Protected in escrow</small></div>${badge('Active')}</div><div class="activity-item"><div class="activity-dot">↗</div><div class="activity-copy"><strong>${formatMoney(450)} released</strong> · Plant care<small>Monday · Task approved</small></div>${badge('Completed')}</div></div></section></div><div class="grid"><section class="card panel"><div class="panel-head"><h2>How escrow works</h2></div><div class="flow-steps">${flowStep('Client funds escrow','Payment is safely held before work begins.',true)}${flowStep('Provider completes task','Message and track progress in one place.',true)}${flowStep('Client approves','Review the work before payment is released.',false)}${flowStep('Provider gets paid','Funds are released after approval.',false)}</div><button class="btn" style="width:100%;justify-content:center" onclick="notify('Escrow help opened')">Learn about payment protection</button></section><section class="card panel"><h3 style="font-size:13px;margin:0 0 8px">Good to know</h3><p style="font-size:11px;color:#7c888f;line-height:1.65;margin:0">Our platform protects task payments during the transaction. The platform does not provide payroll, tax calculations, or tax processing.</p></section></div></div>`}
function historyPage(){let rows=[{title:'Plant care while I’m out of town',person:'Lea Flores',date:'Oct 2, 2025',amount:45,status:'Completed'},{title:'Assemble a standing desk',person:'Angelo Cruz',date:'Sep 28, 2025',amount:60,status:'Active'},{title:'Help moving a sofa this weekend',person:'Juan Dela Cruz',date:'Sep 25, 2025',amount:85,status:'Active'},...state.released.size?[{title:'Completed local task',person:'Juan Dela Cruz',date:'Sep 20, 2025',amount:50,status:'Completed'}]:[]];return `${header('Transaction history','A clear record of your completed and ongoing gigs.') }<div class="toolbar"><div class="filter-row"><button class="filter-chip selected">All transactions</button><button class="filter-chip" onclick="notify('Showing completed transactions')">Completed</button><button class="filter-chip" onclick="notify('Showing active transactions')">Active</button></div><button class="btn" onclick="notify('Your transaction summary is ready')">↓ Export summary</button></div><div class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Gig</th><th>Provider / client</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong>${r.title}</strong><span class="muted">GL-${String(341+i).padStart(5,'0')}</span></td><td>${r.person}</td><td>${r.date}</td><td><strong>${formatMoney(r.amount)}</strong></td><td>${badge(r.status)}</td><td><button class="link-btn" onclick="go('${r.status==='Active'?'transactions':'reviews'}')">Details →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function messagesPage(){let c=state.messages[state.activeChat]||state.messages[0];return `${header('Messages','Chat with people in your community.') }<div class="card message-layout"><div class="thread-list"><div class="thread-header"><strong style="font-size:13px">Conversations · ${state.messages.length}</strong><label class="search-top" style="width:100%;margin-top:11px"><span>⌕</span><input placeholder="Search messages" oninput="filterThreads(this.value)" /></label></div><div class="threads-list-body" id="threadsList">${state.messages.map((m,i)=>`<div class="thread ${state.activeChat===i?'selected':''}" data-name="${escapeHtml(m.name.toLowerCase())}" onclick="state.activeChat=${i};render()"><div class="avatar ${escapeHtml(m.tone||'')}">${escapeHtml(m.initials)}</div><div class="thread-info"><div class="thread-top"><strong>${escapeHtml(m.name)}</strong><small>${escapeHtml(m.time)}</small></div><p>${escapeHtml(m.last)}</p></div></div>`).join('')}</div></div><div class="chat"><div class="chat-head"><div class="person-row"><div class="avatar ${escapeHtml(c.tone||'')}">${escapeHtml(c.initials)}</div><div><strong>${escapeHtml(c.name)}</strong><small>${escapeHtml(c.gig||'Community conversation')}</small></div></div><button class="icon-btn" onclick="go('transactions')" aria-label="Transaction details">···</button></div><div class="chat-body" id="chatBody"><div class="chat-date">Today</div>${c.chat.map(m=>`<div class="bubble ${m[0]==='mine'?'mine':''} ${m[3]==='ai'?'ai-reply':''}">${m[3]==='ai'?'<span class="ai-note">AI-generated demo reply</span>':''}${escapeHtml(m[1])}<small>${escapeHtml(m[2])}</small></div>`).join('')}${state.typingChats.has(state.activeChat)?'<div class="bubble ai-reply"><span class="ai-note">AI assistant is replying…</span>•••</div>':''}</div><form class="chat-compose" onsubmit="sendMessage(event)"><input id="messageInput" placeholder="Write a message…" autocomplete="off"><button class="btn primary" type="submit">Send ↑</button></form></div></div>`}
function filterThreads(query){const q=query.toLowerCase();document.querySelectorAll('#threadsList .thread').forEach(thread=>thread.classList.toggle('page-hidden',!thread.dataset.name.includes(q)))}

function openNewConversationModal(){modal(`<form onsubmit="startConversation(event)"><h2>New conversation</h2><p>Start a message with someone in your community.</p><div class="field"><label for="conversationName">Person’s name</label><input id="conversationName" name="name" required maxlength="60" placeholder="Full name"></div><div class="field"><label for="conversationGig">What is this about?</label><input id="conversationGig" name="gig" required maxlength="100" placeholder="Gig or message topic"></div><button class="btn primary" type="submit">Start messaging</button></form>`)}

function replyAsAssistant(message,conversation){const lower=message.toLowerCase();if(/when|time|available|schedule|tomorrow|today/.test(lower))return `Thanks for checking in! Let's confirm a time that works for the ${conversation.gig} here.`;if(/where|address|location|meet/.test(lower))return 'Thanks for asking! Let’s confirm the exact meeting point here before the gig starts.';if(/pay|payment|money|escrow/.test(lower))return 'Payments are protected through the in-app escrow flow and released after the task is approved.';if(/thank|thanks/.test(lower))return 'You’re welcome! Feel free to message here if anything changes before the task.';return `Thanks for your message about ${conversation.gig}. I’ve received it and will follow up here with the details.`}
function sendMessage(e){e.preventDefault();const inp=document.getElementById('messageInput');const text=inp.value.trim();if(!text)return;const conversation=state.messages[state.activeChat];conversation.chat.push(['mine',text,'Now']);conversation.last=text;conversation.time='Now';state.typingChats.add(state.activeChat);saveDemo();render();setTimeout(()=>{const reply=replyAsAssistant(text,conversation);conversation.chat.push(['theirs',reply,'Now','ai']);conversation.last=reply;state.typingChats.delete(state.messages.indexOf(conversation));saveDemo();if(state.page==='messages'&&state.messages[state.activeChat]===conversation)render()},700)}

dal()">＋ Write a review</button></section></div></div>`}

function saveProfile(event){event.preventDefault();const values=Object.fromEntries(new FormData(event.target));state.profile.name=values.name.trim();state.profile.username=values.username.trim().replace(/^@/,'').toLowerCase();state.profile.islandGroup=values.islandGroup;state.profile.region=values.region;state.profile.country='Philippines';state.profile.locality=values.location.trim();state.profile.province=values.province.trim();state.profile.location=[state.profile.locality,state.profile.province,state.profile.region,state.profile.islandGroup,'Philippines'].join(', ');state.profile.about=values.about.trim();state.profile.skills=values.skills.trim();if(state.pendingProfilePhoto)state.profile.photo=state.pendingProfilePhoto;state.pendingProfilePhoto='';saveDemo();closeModal();render();notify('Profile updated')}
function signOut(){state.authenticated=false;state.authMode='signin';saveDemo();go('auth');notify('You have signed out')}
function adminPage(){return `${header('Admin center','A pulse on local community activity.') }<div class="admin-highlight"><strong>◈ &nbsp;Platform activity</strong> &nbsp;This dashboard monitors local activity in the Philippines. Admin tools support community safety, payment oversight, and dispute resolution.</div><div class="grid stats">${stat('Community members','248','<span class="up">↑ 12%</span> this month','blue')}${stat('Open gigs','36','Across 8 categories','')}${stat('Escrow volume',formatMoney(472000),'Across 52 transactions','amber')}${stat('Needs attention','2','Disputes awaiting review','gray')}</div><div class="grid dashboard-grid"><section class="card panel"><div class="panel-head"><h2>Platform activity</h2><span class="badge active">Live monitoring</span></div><div class="activity"><div class="activity-item"><div class="activity-dot">＋</div><div class="activity-copy"><strong>New gig posted</strong> · Grocery pickup<small>3 minutes ago · Barangay Matina, Davao City, Davao del Sur</small></div></div><div class="activity-item"><div class="activity-dot">◈</div><div class="activity-copy"><strong>Escrow funded</strong> · ${formatMoney(850)} secured<small>18 minutes ago</small></div></div><div class="activity-item"><div class="activity-dot">✓</div><div class="activity-copy"><strong>Task approved</strong> · Payment released<small>42 minutes ago</small></div></div><div class="activity-item"><div class="activity-dot">☆</div><div class="activity-copy"><strong>New community review</strong> · 5 stars<small>1 hour ago</small></div></div></div></section><section class="card panel"><div class="panel-head"><h2>Admin tools</h2></div><div class="gig-list"><div class="gig-row" onclick="go('disputes')"><div class="gig-icon pink">!</div><div class="gig-main"><h3>Dispute resolution</h3><p>2 cases need attention</p></div><span class="badge disputed">2 open</span></div><div class="gig-row" onclick="notify('Member management opened')"><div class="gig-icon">◎</div><div class="gig-main"><h3>Member management</h3><p>Review community accounts</p></div><span>→</span></div><div class="gig-row" onclick="notify('Escrow monitoring opened')"><div class="gig-icon green">◈</div><div class="gig-main"><h3>Escrow monitoring</h3><p>Payment and transaction overview</p></div><span>→</span></div></div><div class="progress-wrap"><div class="progress-top"><span>Successful task completion</span><span>96.4%</span></div><div class="progress"><span style="width:96.4%"></span></div></div></section></div>`}
function disputesPage(){return `${header('Dispute resolution','Review concerns and help both parties reach a fair outcome.',`<button class="btn" onclick="go('admin')">← Admin center</button>`)}<div class="admin-highlight"><strong>Careful, neutral review</strong> &nbsp;Use transaction records and in-app messages to understand each report. Escrow stays protected while a case is under review.</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:15px"><section class="card panel"><div class="panel-head"><div><div class="eyebrow">Case #DSP-024</div><h2 style="font-size:14px">Task not completed as agreed</h2></div>${badge('Disputed')}</div><div class="person-row" style="margin:15px 0"><div class="avatar rose">MS</div><div><strong>Maria Santos · Client</strong><small>Moving &amp; delivery · ${formatMoney(850)} in escrow</small></div></div><p style="font-size:11px;color:#718087;line-height:1.65">“The provider arrived, but we ran out of time before the second item was moved. I’d like to discuss a partial payment.”</p><div class="line-item"><span>Reported</span><strong>Today, 8:14 AM</strong></div><div class="line-item"><span>Escrow status</span><strong>Protected · ${formatMoney(850)}</strong></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn small" onclick="go('messages')">View messages</button><button class="btn small primary" onclick="resolveDispute()">Review case</button></div></section><section class="card panel"><div class="panel-head"><div><div class="eyebrow">Case #DSP-023</div><h2 style="font-size:14px">Payment approval delayed</h2></div>${badge('Review')}</div><div class="person-row" style="margin:15px 0"><div class="avatar blue">AC</div><div><strong>Angelo Cruz · Provider</strong><small>Desk assembly · ${formatMoney(600)} in escrow</small></div></div><p style="font-size:11px;color:#718087;line-height:1.65">“The task was completed three days ago, but I haven’t heard back about approval.”</p><div class="line-item"><span>Reported</span><strong>Yesterday, 3:42 PM</strong></div><div class="line-item"><span>Escrow status</span><strong>Protected · ${formatMoney(600)}</strong></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn small" onclick="go('messages')">View messages</button><button class="btn small primary" onclick="resolveDispute()">Review case</button></div></section></div>`}
function resolveDispute(){modal(`<h2>Review dispute</h2><p>Choose the next step for this case. Escrow remains protected until a resolution.</p><div class="field"><label>Resolution action</label><select><option>Request more information from both parties</option><option>Recommend partial payment</option><option>Release payment to provider</option><option>Refund client</option></select></div><div class="field"><label>Admin notes</label><textarea placeholder="Summarize what you reviewed and next steps…"></textarea></div><button class="btn primary" onclick="closeModal();notify('Case update saved securely')">Save case update</button>`)}
function regionOptions(group,selected=''){return (locationRegions[group]||[]).map(region=>`<option value="${escapeHtml(region)}" ${region===selected?'selected':''}>${escapeHtml(region)}</option>`).join('')}
function updateRegionOptions(selectId,group){const select=document.getElementById(selectId);if(!select)return;select.innerHTML=regionOptions(group);if(select.options.length)select.value=select.options[0].value}
function latestValidBirthDate(){const date=new Date();date.setFullYear(date.getFullYear()-18);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function ageFromBirthDate(value){if(!value)return 0;const birth=new Date(`${value}T00:00:00`);if(Number.isNaN(birth.getTime()))return 0;const today=new Date();let age=today.getFullYear()-birth.getFullYear();if(today.getMonth()<birth.getMonth()||(today.getMonth()===birth.getMonth()&&today.getDate()<birth.getDate()))age--;return age}
function updateSignupAge(value){const age=document.getElementById('signupAge');if(age)age.value=value?`${ageFromBirthDate(value)} years old`:''}
function toggleCustomProfile(){const selected=document.querySelector('input[name="customizeProfile"]:checked');const fields=document.getElementById('customProfileFields');if(fields)fields.classList.toggle('page-hidden',!selected||selected.value!=='yes')}
function authPage(){return `<div style="min-height:68vh;display:grid;place-items:center"><section class="card panel" style="width:min(560px,100%);padding:30px"><div class="auth-switch"><button class="btn ${state.authMode==='create'?'primary':''}" type="button" onclick="setAuthMode('create')">Create account</button><button class="btn ${state.authMode!=='create'?'primary':''}" type="button" onclick="setAuthMode('signin')">Sign in</button></div>${state.authMode==='create'?createAccountForm():signInForm()}<p class="privacy-note">This is a local demo account stored in this browser. Username and ID lookup works here only; public discovery across devices requires a shared account service.</p></section></div>`}
function setAuthMode(mode){state.authMode=mode==='create'?'create':'signin';render()}
function createAccountForm(){return `<h1 style="font-size:22px;margin-bottom:6px">Join the community</h1><p style="font-size:12px;color:var(--muted);margin-bottom:18px">Create a profile. You must be at least 18 years old.</p><form onsubmit="createAccount(event)"><div class="field"><label for="signupName">Full name</label><input id="signupName" name="name" required maxlength="60" autocomplete="name" placeholder="Your first and last name"></div><div class="field"><label for="signupUsername">Choose a username</label><input id="signupUsername" name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9._]{3,24}" autocomplete="username" placeholder="e.g. juan.delacruz"><small>3–24 characters: letters, numbers, dots, or underscores.</small></div><div class="field"><label for="signupBirthDate">Birthday</label><input id="signupBirthDate" name="birthDate" type="date" required max="${latestValidBirthDate()}" oninput="updateSignupAge(this.value)" autocomplete="bday"></div><div class="field"><label for="signupAge">Age</label><input id="signupAge" type="text" readonly placeholder="Calculated from birthday" aria-live="polite"><small>Accounts are available to people 18 and older.</small></div><div class="auth-section"><strong>Where are you located?</strong><div class="field"><label for="signupCountry">Country</label><select id="signupCountry" name="country" required><option value="Philippines" selected>Philippines</option></select></div><div class="field"><label for="signupIslandGroup">Island group</label><select id="signupIslandGroup" name="islandGroup" onchange="updateRegionOptions('signupRegion',this.value)" required><option value="Luzon" selected>Luzon</option><option value="Visayas">Visayas</option><option value="Mindanao">Mindanao</option></select></div><div class="field"><label for="signupRegion">Region</label><select id="signupRegion" name="region" required>${regionOptions('Luzon','National Capital Region (NCR)')}</select></div><div class="auth-location"><div class="field"><label for="signupProvince">Province</label><input id="signupProvince" name="province" required maxlength="80" placeholder="e.g. Metro Manila"></div><div class="field"><label for="signupLocality">City / municipality / barangay</label><input id="signupLocality" name="locality" required maxlength="100" placeholder="e.g. Quezon City"></div></div></div><div class="auth-section"><strong>Would you like to customize your profile?</strong><div class="filter-row" style="margin:10px 0"><label class="btn"><input type="radio" name="customizeProfile" value="yes" required onchange="toggleCustomProfile()"> Yes, customize</label><label class="btn"><input type="radio" name="customizeProfile" value="no" required onchange="toggleCustomProfile()"> Not now</label></div><div id="customProfileFields" class="page-hidden"><div class="field"><label for="signupPhoto">Profile photo (optional)</label><input id="signupPhoto" type="file" accept="image/*" onchange="processProfilePhoto(this,'signupPhotoPreview')"><div id="signupPhotoPreview" class="photo-preview"></div></div><div class="field"><label for="signupAbout">About you (optional)</label><textarea id="signupAbout" name="about" maxlength="500" placeholder="Tell your community a little about yourself."></textarea></div><div class="field"><label for="signupSkills">Skills and interests (optional)</label><input id="signupSkills" name="skills" maxlength="200" placeholder="Errands, pet care, home projects"></div></div></div><button class="btn primary" style="width:100%;justify-content:center;margin-top:18px" type="submit">Create my account</button></form>`}
function signInForm(){return `<h1 style="font-size:22px;margin-bottom:6px">Welcome back</h1><p style="font-size:12px;color:var(--muted);margin-bottom:18px">Sign in with your username or member ID and birthday.</p><form onsubmit="signIn(event)"><div class="field"><label for="signinIdentity">Username or member ID</label><input id="signinIdentity" name="identity" required autocomplete="username" placeholder="Username or GL-12345678"></div><div class="field"><label for="signinBirthDate">Birthday</label><input id="signinBirthDate" name="birthDate" type="date" required autocomplete="bday"></div><button class="btn primary" style="width:100%;justify-content:center" type="submit">Sign in</button></form>`}
function signIn(event){event.preventDefault();const values=Object.fromEntries(new FormData(event.target));const identity=values.identity.trim().replace(/^@/,'').toLowerCase();const matches=state.profile.accountCreated&&[state.profile.username,state.profile.userId].some(value=>String(value).toLowerCase()===identity);if(!matches||state.profile.birthDate!==values.birthDate){notify('That username/ID and birthday do not match an account in this browser.');return}state.authenticated=true;saveDemo();go('home');notify('Signed in and profile loaded')}
async function createAccount(event){event.preventDefault();const values=Object.fromEntries(new FormData(event.target));if(ageFromBirthDate(values.birthDate)<18){notify('You must be at least 18 years old to create an account.');return}if(!/^[A-Za-z0-9._]{3,24}$/.test(values.username)){notify('Choose a username using 3–24 letters, numbers, dots, or underscores.');return}const existingPhoto=document.getElementById('signupPhoto')?.files[0];let photo='';if(existingPhoto){photo=await resizeProfilePhoto(existingPhoto);if(!photo)return}const location=[values.locality.trim(),values.province.trim(),values.region,values.islandGroup,values.country].filter(Boolean).join(', ');const customize=values.customizeProfile==='yes';state.profile={name:values.name.trim(),username:values.username.trim().toLowerCase(),userId:makeUserId(),birthDate:values.birthDate,country:values.country,islandGroup:values.islandGroup,region:values.region,location,photo,about:customize&&values.about.trim()?values.about.trim():`A community member based in ${values.locality.trim()}, ${values.province.trim()}.`,skills:customize&&values.skills.trim()?values.skills.trim():'Community member',accountCreated:true};state.authenticated=true;saveDemo();go('home');notify(`Account created. Your member ID is ${state.profile.userId}`)}
function processProfilePhoto(input,previewId){const file=input.files&&input.files[0];if(!file)return;resizeProfilePhoto(file).then(photo=>{if(!photo)return;state.pendingProfilePhoto=photo;const preview=document.getElementById(previewId);if(preview)preview.innerHTML=`<img class="profile-photo" src="${photo}" alt="Selected profile photo"><span>Photo ready to save</span>`}).catch(error=>{console.error('Could not process the selected profile photo.',error);notify('Could not load that photo. Try another image file.')})}
function resizeProfilePhoto(file){return new Promise(resolve=>{if(!file.type.startsWith('image/')){notify('Choose an image file for your profile photo.');resolve('');return}if(file.size>8*1024*1024){notify('Choose a photo smaller than 8 MB.');resolve('');return}const objectUrl=URL.createObjectURL(file);const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const context=canvas.getContext('2d');const side=Math.min(image.naturalWidth,image.naturalHeight);context.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,256,256);resolve(canvas.toDataURL('image/webp',0.8))}catch(error){console.error('Could not resize the selected profile photo.',error);notify('Could not process that photo. Try another image.');resolve('')}finally{URL.revokeObjectURL(objectUrl)}};image.onerror=()=>{URL.revokeObjectURL(objectUrl);notify('Could not load that photo. Try another image file.');resolve('')};image.src=objectUrl})}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div>${html.slice(0,0)}</div><button class="close-btn" onclick="closeModal()">×</button></div>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
render();
</script>
<script src="/static/backend.js"></script>
</body>
</html>
